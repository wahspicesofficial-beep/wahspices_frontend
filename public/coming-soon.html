<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coming Soon — Wah Spices</title>
  <meta name="description" content="Wah Spices is coming soon. Premium quality masalas & spices crafted with tradition." />
  <link rel="icon" href="/favicon.svg" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green: #1a5c2e;
      --green-dark: #0f3d1e;
      --cream: #fff9f0;
      --orange: #f5a623;
      --red: #c8371e;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: var(--cream);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Background decorative circles */
    .bg-circle {
      position: fixed;
      border-radius: 50%;
      opacity: 0.06;
      background: var(--green);
      pointer-events: none;
    }
    .bg-circle-1 { width: 600px; height: 600px; top: -200px; right: -200px; }
    .bg-circle-2 { width: 400px; height: 400px; bottom: -150px; left: -150px; }
    .bg-circle-3 { width: 200px; height: 200px; top: 40%; left: 5%; opacity: 0.04; }

    /* Floating spice dots */
    .spice-dot {
      position: fixed;
      border-radius: 50%;
      animation: floatDot linear infinite;
      pointer-events: none;
      opacity: 0.15;
    }

    @keyframes floatDot {
      0%   { transform: translateY(0) rotate(0deg); opacity: 0.15; }
      50%  { opacity: 0.25; }
      100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
    }

    /* Main card */
    .card {
      position: relative;
      z-index: 10;
      text-align: center;
      padding: 60px 40px;
      max-width: 680px;
      width: 90%;
      animation: fadeUp 0.8s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Logo */
    .logo-wrap {
      margin-bottom: 36px;
      animation: logoIn 0.9s cubic-bezier(0.34,1.56,0.64,1) both 0.2s;
    }

    @keyframes logoIn {
      from { opacity: 0; transform: scale(0.6); }
      to   { opacity: 1; transform: scale(1); }
    }

    .logo-wrap img {
      height: 110px;
      width: auto;
      object-fit: contain;
      filter: drop-shadow(0 8px 24px rgba(26,92,46,0.18));
    }

    /* Badge */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--orange);
      color: #fff;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 6px 18px;
      border-radius: 100px;
      margin-bottom: 20px;
      animation: fadeUp 0.6s ease both 0.4s;
    }

    /* Heading */
    h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(48px, 10vw, 88px);
      font-weight: 900;
      color: var(--green);
      line-height: 1.05;
      margin-bottom: 16px;
      animation: fadeUp 0.6s ease both 0.5s;
    }

    h1 span {
      color: var(--orange);
    }

    /* Tagline */
    .tagline {
      font-size: 16px;
      color: #5a7060;
      font-weight: 400;
      line-height: 1.7;
      max-width: 460px;
      margin: 0 auto 40px;
      animation: fadeUp 0.6s ease both 0.6s;
    }

    /* Divider */
    .divider {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 40px;
      animation: fadeUp 0.6s ease both 0.65s;
    }
    .divider-line { flex: 1; height: 1px; background: linear-gradient(to right, transparent, #c8d9c0, transparent); }
    .divider-icon { font-size: 20px; }

    /* Footer */
    .footer-text {
      position: fixed;
      bottom: 20px;
      left: 0; right: 0;
      text-align: center;
      font-size: 12px;
      color: #a5b9a8;
      animation: fadeUp 0.6s ease both 1s;
    }
    .footer-text strong { color: var(--green); }

    /* Floating logo animation */
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-10px); }
    }
    .logo-wrap img { animation: float 4s ease-in-out infinite; }

    @media (max-width: 480px) {
      .card { padding: 48px 24px; }
    }
  </style>
</head>
<body>

  <!-- Background circles -->
  <div class="bg-circle bg-circle-1"></div>
  <div class="bg-circle bg-circle-2"></div>
  <div class="bg-circle bg-circle-3"></div>

  <!-- Main content -->
  <div class="card">

    <div class="logo-wrap">
      <img src="/wah_logo.jpg" alt="Wah Spices" />
    </div>

    <div class="badge">🌶️ &nbsp; Something Exciting is Brewing</div>

    <h1>Coming<br /><span>Soon</span></h1>

    <p class="tagline">
      Premium quality masalas &amp; spices, crafted with tradition and love.<br />
      We're putting the final touch on something truly special for you.
    </p>

    <div class="divider">
      <div class="divider-line"></div>
      <div class="divider-icon">✦</div>
      <div class="divider-line"></div>
    </div>


  </div>

  <p class="footer-text">© 2026 <strong>Wah Spices®</strong> &nbsp;·&nbsp; wahspices.in &nbsp;·&nbsp; All Rights Reserved</p>

  <script>
    // ── Floating spice dots ───────────────────────────────────────────────
    const spices = ['🌶️','✦','◆','•','★'];
    for (let i = 0; i < 18; i++) {
      const el = document.createElement('div');
      el.className = 'spice-dot';
      const size = Math.random() * 8 + 4;
      el.style.cssText = `
        width: ${size}px; height: ${size}px;
        background: ${Math.random() > 0.5 ? '#1a5c2e' : '#f5a623'};
        left: ${Math.random() * 100}vw;
        bottom: -${size}px;
        animation-duration: ${Math.random() * 12 + 10}s;
        animation-delay: ${Math.random() * 8}s;
      `;
      document.body.appendChild(el);
    }
  </script>
</body>
</html>
